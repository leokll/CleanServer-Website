<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Clean Server - 玩家指南</title>
    <style>
        /* 1. 定义本地字体 */
        @font-face {
            font-family: 'Minecraft';
            src: url('minecraft.ttf') format('truetype');
        }

        body {
            margin: 0;
            background-color: #1a1a1a;
            /* 暗色网格背景 */
            background-image: linear-gradient(0deg, transparent 24%, rgba(255, 255, 255, .05) 25%, rgba(255, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, .05) 75%, rgba(255, 255, 255, .05) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(255, 255, 255, .05) 25%, rgba(255, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, .05) 75%, rgba(255, 255, 255, .05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            font-family: 'Minecraft', 'SimSun', monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .book-container {
            width: 80%;
            max-width: 700px;
            background: #e3d2b4; /* 书页纸张颜色 */
            color: #4b3621; /* 深褐色文字 */
            padding: 40px 50px;
            box-shadow: 0 0 20px #000;
            border: 5px solid #8d6e63; /* 书皮边框 */
            min-height: 600px;
            position: relative;
        }

        h1 { text-align: center; border-bottom: 2px solid #8d6e63; padding-bottom: 10px; font-weight: normal; font-size: 2.5rem; }
        h2 { margin-top: 30px; color: #3e2723; font-size: 1.8rem; font-weight: normal; }
        
        p, li { 
            line-height: 1.6; 
            font-size: 1.3rem; 
        }

        ul { padding-left: 20px; }
        
        code {
            background: #d7ccc8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: inherit;
            color: #d32f2f;
        }

        .highlight { color: #d32f2f; font-weight: bold; }

        .back-btn {
            display: block;
            width: 150px;
            margin: 40px auto 0;
            padding: 10px;
            background: #7d7d7d;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border: 2px solid #000;
            box-shadow: inset 2px 2px 0px #a0a0a0, inset -2px -2px 0px #555;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .back-btn:hover { background: #7e87b6; color: #ffffa0; box-shadow: inset 2px 2px 0px #aab2ff, inset -2px -2px 0px #484e75; }

    </style>
</head>
<body>

    <div class="book-container">
        <h1>Clean Server 指南</h1>

        <h2>⚡ 如何加入</h2>
        <p>1. 启动 Minecraft 1.8 至 1.21.11。</p>
        <p>2. 点击“多人游戏” -> “添加服务器”。</p>
        <p>3. 输入地址：<span class="highlight">3618.org</span></p>

        <h2>🛡️ 规则说明</h2>
        <p>本服务器为 <strong>无规则服务器 (Anarchy)</strong>。</p>
        <ul>
            <li>允许自由 PVP / 抄家</li>
            <li>允许建立任意红石机器</li>
            <li>没有领地保护，请隐藏好你的基地！</li>
        </ul>

        <h2>🔧 常用指令</h2>
        <ul>
            <li><code>/tpa &lt;玩家名&gt;</code> - 请求传送</li>
            <li><code>/sethome</code> - 设置家</li>
            <li><code>/home</code> - 回家</li>
            <li><code>/spawn</code> - 回主城</li>
        </ul>

        <h2>📞 联系方式</h2>
        <p>QQ 群：971113367</p>

        <a href="index.html" class="back-btn">完成阅读</a>
    </div>

</body>
</html>
